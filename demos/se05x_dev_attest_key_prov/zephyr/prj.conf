# This file is used to set configs or override default configurations for  the example.

# Enable I2C
CONFIG_I2C=y

# Adjust memory configs as needed
CONFIG_MAIN_STACK_SIZE=20000
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_CHIP_TASK_STACK_SIZE=13312

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_CIPHER=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_ALG_CBC_PKCS7=y

# CONFIG_MBEDTLS_USE_PSA_CRYPTO=y
CONFIG_MBEDTLS_ASN1_PARSE_C=y
CONFIG_MBEDTLS_HAVE_ASM=y
CONFIG_MBEDTLS_AES_ROM_TABLES=y
CONFIG_MBEDTLS_AES_FEWER_TABLES=y

CONFIG_MBEDTLS_PK_PARSE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_X509_USE_C=y
CONFIG_MBEDTLS_PKCS5_C=y

CONFIG_MBEDTLS_PEM_WRITE_C=y

# # Enable all PSA crypto features (for testing only)
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y

# # Enable all key types
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
 
# # Enable all curves
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
 
# # Enable all algorithms
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_ALG_CTR=y
#CONFIG_MBEDTLS_PSA_CRYPTO_STORAGE_C=y
CONFIG_SECURE_STORAGE=y

# # RNG (REQUIRED!)
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_CTR_DRBG_C=y

CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_X509_CRL_PARSE_C=y
CONFIG_MBEDTLS_X509_CSR_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_WRITE_C=y
CONFIG_MBEDTLS_MD_C=y


# ============================================================================
# ECC Key Pair Generation (CRITICAL!)
# ============================================================================
# Note: Zephyr uses PSA_WANT_* not CONFIG_PSA_WANT_*
#CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y

# Public key support
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# ============================================================================
# ECC Curves - SECP_R1 Family (NIST P curves)
# ============================================================================
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# ============================================================================
# Algorithms for ECC
# ============================================================================
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA=y

# Hash algorithms (needed for ECDSA)
CONFIG_PSA_WANT_ALG_SHA_256=y

# ============================================================================
# Random Number Generator (ABSOLUTELY REQUIRED!)
# ============================================================================
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_CTR_DRBG_C=y

# Platform entropy source
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# ============================================================================
# Additional PSA Features
# ============================================================================
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y


CONFIG_SECURE_STORAGE=y # enables MBEDTLS_PSA_CRYPTO_STORAGE_C
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y


#CONFIG_PSA_CRYPTO_CLIENT=y